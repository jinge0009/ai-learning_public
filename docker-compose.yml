version: '3.8'

services:
  # 1. 数据库
  db:
    image: postgres:15
    container_name: pg_db
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai_network

  # 2. 后端
  rag_backend:
    build: .
    container_name: rag_backend
    command: uvicorn day37_rag_api:app --host 0.0.0.0 --port 8000
    # 注意：这里不再需要向外暴露 8000 端口了，因为前端通过 Nginx 内部转发
    expose:
      - "8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
      - ./local_models:/app/local_models
      - ./.env:/app/.env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://ai_user:ai_password@db:5432/ai_db
      - REDIS_URL=redis://redis:6379/0  # ★ 新增这行
    depends_on:
      - db
      - redis                           # ★ 依赖加上 redis
    networks:
      - ai_network

  # 3. 前端 (升级为 Nginx 容器)
  web_ui:
    build: ./ai-frontend  # ★ 指向前端目录
    container_name: web_ui
    ports:
      - "80:80"            # ★ 将外网的 80 端口映射到容器的 80
    depends_on:
      - rag_backend
    networks:
      - ai_network

  # 4. 新增：Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  pgdata: