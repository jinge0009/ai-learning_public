version: '3.8'

services:
  # 新增：PostgreSQL 数据库
  db:
    image: postgres:15
    container_name: pg_db
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai_network

  # 服务1：后端 RAG API
  rag_backend:
    build: .
    container_name: rag_backend
    command: uvicorn day37_rag_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
      - ./local_models:/app/local_models
      - ./.env:/app/.env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://ai_user:ai_password@db:5432/ai_db
    depends_on:
      - db
    networks:
      - ai_network

  # 服务2：前端 Streamlit
  web_ui:
    build: .
    container_name: web_ui
    command: streamlit run day37_ui_rag_stream.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - rag_backend
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  pgdata: