server {
    listen 80;
    server_name localhost;

    # 前端静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 解决 React 刷新 404 问题
    }

    # 反向代理后端 API
    location /api/ {
        # 注意：这里写的是 Docker Compose 里的服务名
        proxy_pass http://rag_backend:8000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 支持 SSE 流式传输（极其关键！）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}